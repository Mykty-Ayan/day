name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r day-backend/requirements.txt
      - name: Lint with ruff
        run: cd day-backend && ruff check .

  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: day_test
          POSTGRES_USER: day
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r day-backend/requirements.txt
      - name: Run tests
        run: cd day-backend && pytest tests/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://day:test_password@localhost:5432/day_test

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: day-frontend/package-lock.json
      - name: Install dependencies
        run: cd day-frontend && npm ci
      - name: Lint
        run: cd day-frontend && npm run lint
      - name: Type check
        run: cd day-frontend && npx tsc --noEmit

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: day-frontend/package-lock.json
      - name: Install dependencies
        run: cd day-frontend && npm ci
      - name: Build
        run: cd day-frontend && npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t day-backend:test day-backend/
