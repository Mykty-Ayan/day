name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r day-backend/requirements.txt
      - name: Lint with ruff
        run: cd day-backend && ruff check .

  backend-test:
    runs-on: ubuntu-latest
    needs: backend-lint

    # Integration tests need a real database. Without one they were deselected
    # in CI, which is how nineteen analytics tests sat red for months while the
    # pipeline stayed green.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: day
          POSTGRES_PASSWORD: day
          POSTGRES_DB: day_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET: ci-test-secret-key-not-for-production
      DATABASE_URL: postgresql+asyncpg://day:day@localhost:5432/day_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r day-backend/requirements.txt
      - name: Apply migrations
        run: cd day-backend && alembic upgrade head
      - name: Run unit tests
        run: cd day-backend && pytest tests/ -v
      # Deselected by default via pyproject's addopts, so they need naming.
      - name: Run integration tests
        run: cd day-backend && pytest -m integration tests/ -v

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: day-frontend/package-lock.json
      - name: Install dependencies
        run: cd day-frontend && npm ci
      - name: Lint
        run: cd day-frontend && npm run lint
      # `tsc --noEmit` with no project reads tsconfig.json, which is a solution
      # file with `files: []` — it checked nothing and passed on anything. This
      # covers src and tests together.
      - name: Type check
        run: cd day-frontend && npm run typecheck

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: day-frontend/package-lock.json
      - name: Install dependencies
        run: cd day-frontend && npm ci
      - name: Build
        run: cd day-frontend && npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t day-backend:test day-backend/
