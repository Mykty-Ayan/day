# Included by the server block AND by every location that sets its own
# add_header: nginx drops all inherited add_header directives as soon as a
# location declares one, which is how index.html (and so every app route)
# used to ship without any of these.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# frame-ancestors instead of X-Frame-Options: Telegram Web opens the Mini App
# (/tma) in an iframe, which X-Frame-Options SAMEORIGIN would blank out.
add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://webz.telegram.org; base-uri 'self'; object-src 'none'; form-action 'self'" always;
