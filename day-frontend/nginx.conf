# The robots that draw a link's preview in a chat (WhatsApp, Telegram, Instagram
# and the like) run no script, so the app shell shows them nothing. They get the
# backend's page of Open Graph tags instead; people get the app. Not Viber: its
# in-app browser may call itself so, and a guest would get the bare tags page.
map $http_user_agent $link_preview_robot {
    default 0;
    "~*(whatsapp|facebookexternalhit|facebot|telegrambot|twitterbot|slackbot|linkedinbot|discordbot|vkshare|skypeuripreview|pinterest)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Every route is client-side; unknown paths must still return the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A guest's page (a flat's /s/<code>, an offer's /o/<code>) gets the same app
    # without the Telegram SDK, whose blocking script would hold it up wherever
    # telegram.org is slow. Never cached, as index.html.
    location ~ ^/(?<link_kind>[so])/(?<link_code>[A-Za-z0-9]+)/?$ {
        if ($link_preview_robot) {
            rewrite ^ /__link_preview/$link_kind/$link_code last;
        }
        try_files /guest.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ ^/[so]/ {
        try_files /guest.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The API's origin is written in at build time from VITE_API_URL (Dockerfile).
    # A variable makes nginx resolve the name when asked, through Docker's DNS,
    # not once at start, when a build has no network to resolve it on.
    location ~ ^/__link_preview/(?<preview_kind>[so])/(?<preview_code>[A-Za-z0-9]+)$ {
        internal;
        resolver 127.0.0.11 valid=60s ipv6=off;
        set $api_origin "__API_ORIGIN__";
        proxy_pass $api_origin/api/v1/public/preview/$preview_kind/$preview_code;
        proxy_ssl_server_name on;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Hashed assets are immutable, index.html must never be cached or a deploy
    # leaves browsers pointing at bundles that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
