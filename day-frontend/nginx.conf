server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Every route is client-side; unknown paths must still return the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A guest's page (a flat's /s/<code>, an offer's /o/<code>) gets the same app
    # without the Telegram SDK, whose blocking script would hold it up wherever
    # telegram.org is slow. Never cached, as index.html.
    location ~ ^/[so]/ {
        try_files /guest.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed assets are immutable, index.html must never be cached or a deploy
    # leaves browsers pointing at bundles that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
