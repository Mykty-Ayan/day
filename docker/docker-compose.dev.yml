services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build:
      context: ../day-backend
      dockerfile: Dockerfile
    volumes:
      - ../day-backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../day-frontend
      dockerfile: Dockerfile
      target: build
    volumes:
      - ../day-frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "3000:3000"
      - "5173:5173"

volumes:
  frontend_node_modules:
